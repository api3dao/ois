name: Continuous Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  documentation:
    name: Check links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone @api3/ois
        uses: actions/checkout@v7
      - name: Run lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress './**/*.md'

  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Clone @api3/ois
        uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm lint
      - run: pnpm test

  required-checks-passed:
    name: All required checks passed
    runs-on: ubuntu-latest
    needs: [lint-test]
    steps:
      - run: exit 0
